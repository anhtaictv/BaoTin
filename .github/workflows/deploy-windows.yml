name: Deploy (Windows Server + IIS)

# Active deploy path for the current VPS (Windows Server 2019, no Docker — see docs/DEPLOY.md).
# Manual only — a demo/thi deploy should never go out because of a stray push while judges are
# looking at the live site. Run from the Actions tab when you actually want to ship.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No node_modules in the artifact — sharp and friends are native modules built for this
      # Ubuntu runner and will not run on Windows. The server runs its own `npm ci` (Phần 2 of
      # docs/DEPLOY.md), which fetches/builds the right binaries for Windows x64 itself.
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build dashboard-web-react
        working-directory: dashboard-web-react
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable

      - name: Build dashboard-web (Flutter Web, legacy)
        working-directory: dashboard-web
        run: |
          flutter pub get
          flutter build web --release --base-href /legacy/

      - name: Build mobile-app-citizen (Flutter Web)
        working-directory: mobile-app-citizen
        run: |
          flutter pub get
          flutter build web --release --base-href /citizen/ --dart-define=API_BASE_URL=/api

      - name: Build mobile-app-officer (Flutter Web)
        working-directory: mobile-app-officer
        run: |
          flutter pub get
          flutter build web --release --base-href /officer/ --dart-define=API_BASE_URL=/api

      - name: Collect deploy artifact
        run: |
          mkdir -p artifact/backend artifact/landing artifact/admin artifact/dashboard-web artifact/citizen artifact/officer artifact/data/raw
          cp -r backend/dist artifact/backend/dist
          cp -r backend/prisma artifact/backend/prisma
          cp backend/package.json backend/package-lock.json artifact/backend/
          cp -r landing/. artifact/landing/
          cp -r dashboard-web-react/dist/. artifact/admin/
          cp -r dashboard-web/build/web/. artifact/dashboard-web/
          cp -r mobile-app-citizen/build/web/. artifact/citizen/
          cp -r mobile-app-officer/build/web/. artifact/officer/
          # Only actually needed once (Phần 2's manual seed step), but the VPS has no inbound
          # path to fetch it any other way — riding along in the artifact is simplest.
          cp data/raw/Daklak.geojson artifact/data/raw/

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: artifact
          retention-days: 1

  # Runs ON the VPS itself via a GitHub Actions self-hosted runner (docs/DEPLOY.md) — the VPS's
  # network only ever makes an outbound HTTPS connection to GitHub to poll for jobs, so this
  # needs no inbound port at all (no SSH, no port-forwarding/NAT rule on the provider's side).
  deploy:
    needs: build
    runs-on: [self-hosted, baotin-vps]
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-artifact
          path: artifact

      - name: Copy files into place
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Copy-Item -Force overwrites file-onto-file fine, but not dir-onto-file or vice
          # versa ("Container cannot be copied onto existing leaf item") — and a prior deploy
          # (interrupted, or an older workflow version) can leave a destination entry with a
          # different type than what the current artifact has for that same name. Remove each
          # artifact's own top-level entries from the destination first so the copy is
          # deterministic regardless of prior disk state. Scoped to only the names the artifact
          # actually provides — never touches .env, JWT key files, or node_modules that live
          # alongside these but aren't part of the deploy artifact.
          function Sync-Dir($source, $destination) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Get-ChildItem $source -Name | ForEach-Object {
              $target = Join-Path $destination $_
              if (Test-Path $target) { Remove-Item $target -Recurse -Force }
            }
            Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force
          }

          Sync-Dir "artifact\backend" "C:\baotin\backend"
          Sync-Dir "artifact\landing" "C:\inetpub\baotin"
          Sync-Dir "artifact\admin" "C:\inetpub\baotin\admin"
          Sync-Dir "artifact\dashboard-web" "C:\inetpub\baotin\legacy"
          Sync-Dir "artifact\citizen" "C:\inetpub\baotin\citizen"
          Sync-Dir "artifact\officer" "C:\inetpub\baotin\officer"

          New-Item -ItemType Directory -Force -Path "C:\baotin\data\raw" | Out-Null
          Copy-Item -Path "artifact\data\raw\Daklak.geojson" -Destination "C:\baotin\data\raw\Daklak.geojson" -Force

      - name: Install deps, migrate, restart backend service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Prepend the isolated Node 20 install (docs/DEPLOY.md) to *this process's* PATH only
          # — other software on the VPS already depends on the system-wide Node install, which
          # this never touches (no [Environment]::SetEnvironmentVariable, no uninstall).
          $env:Path = "C:\node20;$env:Path"

          Set-Location C:\baotin\backend
          npm ci --omit=dev

          # Run migrations against the new schema *before* restarting the service, so the
          # new backend code never starts against an un-migrated database.
          npx prisma migrate deploy

          Restart-Service -Name BaoTinBackend
          # IIS itself needs no restart for the static file changes — it reads dist/build.web
          # straight off disk on every request, and this VPS hosts another IIS site we must
          # not disturb.
