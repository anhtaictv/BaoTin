name: Diagnose production 2 (temporary, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

jobs:
  diag:
    runs-on: [self-hosted, baotin-vps]
    environment: production
    steps:
      - name: Officer assignment check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend

          @'
          const { PrismaClient } = require("@prisma/client");
          const prisma = new PrismaClient();
          (async () => {
            const assignedOfficer = await prisma.officer.findUnique({
              where: { id: "04d60a37-3b73-4472-b37d-afdeef5dc2ab" },
              select: { id: true, unitName: true, role: true, username: true, approvalStatus: true },
            });
            console.log("=== officer assigned to the report ===");
            console.log(JSON.stringify(assignedOfficer, null, 2));

            const demoOfficers = await prisma.officer.findMany({
              where: { username: { in: ["demo_officer_approved", "demo_officer_pending"] } },
              select: { id: true, username: true, approvalStatus: true },
            });
            console.log("=== self-registered demo officers ===");
            for (const o of demoOfficers) {
              const assignments = await prisma.officerDistrictAssignment.findMany({
                where: { officerId: o.id },
                select: { districtId: true, isActive: true },
              });
              console.log(JSON.stringify({ ...o, assignments }, null, 2));
            }
            await prisma.$disconnect();
          })().catch((e) => { console.error(e); process.exit(1); });
          '@ | Set-Content -Encoding utf8 _diag2.cjs

          node --env-file=.env _diag2.cjs
          Remove-Item _diag2.cjs
