name: Diagnose production (temporary, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

jobs:
  diag:
    runs-on: [self-hosted, baotin-vps]
    environment: production
    steps:
      - name: Recent reports + notification log tail
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend

          @'
          const { PrismaClient } = require("@prisma/client");
          const prisma = new PrismaClient();
          (async () => {
            const reports = await prisma.report.findMany({
              orderBy: { createdAt: "desc" },
              take: 5,
              select: {
                id: true, source: true, districtId: true, assignedOfficerId: true,
                status: true, urgency: true, createdAt: true, userId: true,
              },
            });
            console.log("=== last 5 reports ===");
            console.log(JSON.stringify(reports, null, 2));

            const districtIds = [...new Set(reports.map(r => r.districtId).filter(Boolean))];
            for (const districtId of districtIds) {
              const assignments = await prisma.officerDistrictAssignment.findMany({
                where: { districtId, isActive: true },
                select: { officerId: true },
              });
              console.log(`district ${districtId}: ${assignments.length} active officer assignment(s)`);
            }
            await prisma.$disconnect();
          })().catch((e) => { console.error(e); process.exit(1); });
          '@ | Set-Content -Encoding utf8 _diag.cjs

          node --env-file=.env _diag.cjs
          Remove-Item _diag.cjs

          Write-Host "=== stdout.log tail (notification-stub lines) ==="
          Get-Content logs\stdout.log -Tail 200 | Select-String "notification-stub|report|error" -CaseSensitive:$false | Select-Object -Last 40
