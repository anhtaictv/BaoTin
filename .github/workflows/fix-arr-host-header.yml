name: Fix IIS proxy for MinIO presigned URLs (temporary, one-off)

# Two separate IIS-level blockers found while verifying the MinIO presigned-URL fix on
# production:
# 1. ARR rewrites the outbound Host header to the proxy target by default, breaking MinIO's
#    AWS SigV4 signature validation (it signs the exact Host header) -> SignatureDoesNotMatch.
# 2. IIS's request-filtering rejects "double escaping" (a %-encoded sequence that itself looks
#    encoded) by default — AWS SigV4 query strings always contain "%2F" (an encoded slash) in
#    X-Amz-Credential, e.g. "admin%2F20260722%2Fus-east-1%2Fs3%2Faws4_request" -> IIS 400s it
#    before the request ever reaches URL Rewrite/MinIO. Scoped to the BaoTin site only, not
#    machine-wide, so the other sites sharing this IIS server keep the stricter default.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, baotin-vps]
    environment: production
    steps:
      - name: Enable preserveHostHeader (ARR) + allowDoubleEscaping (BaoTin site only)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module WebAdministration
          Set-WebConfigurationProperty -pspath "MACHINE/WEBROOT/APPHOST" -filter "system.webServer/proxy" -name "preserveHostHeader" -value "True"
          Set-WebConfigurationProperty -pspath "MACHINE/WEBROOT/APPHOST/BaoTin" -filter "system.webServer/security/requestFiltering" -name "allowDoubleEscaping" -value "True"
          Write-Host "--- preserveHostHeader ---"
          Get-WebConfigurationProperty -pspath "MACHINE/WEBROOT/APPHOST" -filter "system.webServer/proxy" -name "preserveHostHeader"
          Write-Host "--- allowDoubleEscaping (BaoTin) ---"
          Get-WebConfigurationProperty -pspath "MACHINE/WEBROOT/APPHOST/BaoTin" -filter "system.webServer/security/requestFiltering" -name "allowDoubleEscaping"
