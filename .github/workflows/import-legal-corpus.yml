name: Import legal corpus (production)

# Manual only, same self-hosted runner as deploy-windows.yml — must run AFTER at least one
# deploy that includes the data/legal-corpus/*.pdf copy step (deploy-windows.yml), which puts
# the PDFs at C:\baotin\data\legal-corpus\. Safe to rerun any number of times — upserts by
# sourceFileName / (legalDocumentId, articleNumber), see prisma/seed/import-legal-corpus.ts.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

jobs:
  import:
    runs-on: [self-hosted, baotin-vps]
    environment: production
    steps:
      - name: Run legal corpus import
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend
          node --env-file=.env dist\prisma\seed\import-legal-corpus.js
