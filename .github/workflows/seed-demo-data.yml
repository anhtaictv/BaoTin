name: Seed demo data (production)

# Manual only, same self-hosted runner as deploy-windows.yml. Runs the standalone seed
# entrypoints — deliberately NOT dist/prisma/seed/index.js, which reseeds
# districts/cameras/signals/emergency-contacts via plain .create() and would duplicate rows if
# run twice against a database that already has real data (docs/DEPLOY.md). Both steps below
# are safe to rerun any number of times — each skips if its demo content already exists (see
# seed-demo-accounts.ts / seed-demo-reports.ts).
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

jobs:
  seed:
    runs-on: [self-hosted, baotin-vps]
    environment: production
    steps:
      - name: Run demo-accounts seed
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend
          node --env-file=.env dist\prisma\seed\seed-demo-accounts.js

      - name: Run demo-reports seed
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend
          node --env-file=.env dist\prisma\seed\run-seed-demo-reports.js

      - name: Run traffic-accidents seed
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend
          node --env-file=.env dist\prisma\seed\run-seed-traffic-accidents.js

      - name: Run locked-citizen seed
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend
          node --env-file=.env dist\prisma\seed\run-seed-locked-citizen.js

      - name: Run old-districts seed (trưởng xã / commune_head feature)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend
          node --env-file=.env dist\prisma\seed\run-seed-old-districts.js
