name: Set admin username/password (temporary, one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, baotin-vps]
    environment: production
    steps:
      - name: Attach username/password to the existing admin officer (0900000099)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "C:\node20;$env:Path"
          Set-Location C:\baotin\backend

          @'
          const { PrismaClient } = require("@prisma/client");
          const { createHmac, randomBytes, scrypt } = require("node:crypto");
          const { promisify } = require("node:util");
          const scryptAsync = promisify(scrypt);

          function hashPhoneNumber(phoneNumber, keyBase64) {
            const key = Buffer.from(keyBase64, "base64");
            return createHmac("sha256", key).update(phoneNumber.replace(/[\s\-()]/g, "")).digest("hex");
          }
          async function hashPassword(plain) {
            const salt = randomBytes(16);
            const derivedKey = await scryptAsync(plain, salt, 64);
            return `${salt.toString("hex")}:${derivedKey.toString("hex")}`;
          }

          const prisma = new PrismaClient();
          (async () => {
            const phoneHash = hashPhoneNumber("0900000099", process.env.PHONE_BLIND_INDEX_KEY);
            const officer = await prisma.officer.findUnique({ where: { phoneHash } });
            if (!officer) throw new Error("admin officer not found");

            const existingUsername = await prisma.officer.findUnique({ where: { username: "admin" } });
            if (existingUsername && existingUsername.id !== officer.id) {
              throw new Error("username 'admin' already taken by a different officer");
            }

            await prisma.officer.update({
              where: { id: officer.id },
              data: { username: "admin", passwordHash: await hashPassword("admin@123") },
            });
            console.log("done. officer id:", officer.id, "role:", officer.role, "approvalStatus:", officer.approvalStatus);
            await prisma.$disconnect();
          })().catch((e) => { console.error(e); process.exit(1); });
          '@ | Set-Content -Encoding utf8 _set_admin_pw.cjs

          node --env-file=.env _set_admin_pw.cjs
          Remove-Item _set_admin_pw.cjs
