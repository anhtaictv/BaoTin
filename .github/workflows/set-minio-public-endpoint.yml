name: Set MinIO public endpoint (temporary, one-off)

# Must run BEFORE the next deploy-windows.yml run — the backend now requires
# MINIO_PUBLIC_ENDPOINT at startup in production (env.ts fails fast without it), so deploying
# the new code before this would crash-loop the service.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-windows
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, baotin-vps]
    environment: production
    steps:
      - name: Append MINIO_PUBLIC_* to .env if not already present
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $envPath = "C:\baotin\backend\.env"
          $content = Get-Content $envPath -Raw
          if ($content -notmatch "MINIO_PUBLIC_ENDPOINT") {
            Add-Content -Path $envPath -Value "`nMINIO_PUBLIC_ENDPOINT=baotin.work.gd"
            Add-Content -Path $envPath -Value "MINIO_PUBLIC_PORT=443"
            Add-Content -Path $envPath -Value "MINIO_PUBLIC_USE_SSL=true"
            Write-Host "Added MINIO_PUBLIC_* to .env"
          } else {
            Write-Host "MINIO_PUBLIC_ENDPOINT already present, skipping"
          }
          Get-Content $envPath | Select-String "MINIO_PUBLIC"
