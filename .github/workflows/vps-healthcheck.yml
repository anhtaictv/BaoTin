name: VPS Healthcheck

# Ad-hoc diagnostic — runs on the self-hosted VPS runner and reports what's installed, so setup
# progress (docs/DEPLOY.md Phần 1) can be verified without RDP/copy-paste round-trips.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, baotin-vps]
    timeout-minutes: 5
    steps:
      - name: Report installed tooling
        shell: powershell
        run: |
          function Check($label, [scriptblock]$script, [int]$timeoutSec = 15) {
            Write-Host "--- $label ---"
            $job = Start-Job -ScriptBlock $script
            $done = Wait-Job -Job $job -Timeout $timeoutSec
            if (-not $done) {
              Write-Host "TIMED OUT after ${timeoutSec}s"
              Stop-Job -Job $job | Out-Null
            } else {
              try {
                Receive-Job -Job $job -ErrorAction Stop
              } catch {
                Write-Host "NOT FOUND / ERROR: $($_.Exception.Message)"
              }
            }
            Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
            Write-Host ""
          }

          Check "runner identity" { whoami }
          Check "Node 20 isolated install" { Test-Path "C:\node20\node.exe"; C:\node20\node.exe -v }
          Check "PostgreSQL service" { Get-Service postgresql* -ErrorAction Stop | Format-Table Name, Status }
          Check "PostgreSQL listen_addresses" {
            Select-String -Path "C:\Program Files\PostgreSQL\16\data\postgresql.conf" -Pattern "^listen_addresses"
          }
          Check "baotin database + roles" {
            $env:PGPASSWORD = $null
            & "C:\Program Files\PostgreSQL\16\bin\psql.exe" -U postgres -c "\l baotin" -c "\du baotin_migrator baotin_app"
          } 20
          Check "postgis extension present" {
            & "C:\Program Files\PostgreSQL\16\bin\psql.exe" -U postgres -d baotin -c "\dx"
          } 20
