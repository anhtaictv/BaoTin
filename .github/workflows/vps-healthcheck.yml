name: VPS Healthcheck

# Ad-hoc diagnostic — runs on the self-hosted VPS runner and reports what's installed, so setup
# progress (docs/DEPLOY.md Phần 1) can be verified without RDP/copy-paste round-trips.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, baotin-vps]
    timeout-minutes: 5
    steps:
      - name: Report installed tooling
        shell: powershell
        run: |
          function Check($label, [scriptblock]$script, [int]$timeoutSec = 15) {
            Write-Host "--- $label ---"
            $job = Start-Job -ScriptBlock $script
            $done = Wait-Job -Job $job -Timeout $timeoutSec
            if (-not $done) {
              Write-Host "TIMED OUT after ${timeoutSec}s"
              Stop-Job -Job $job | Out-Null
            } else {
              try {
                Receive-Job -Job $job -ErrorAction Stop
              } catch {
                Write-Host "NOT FOUND / ERROR: $($_.Exception.Message)"
              }
            }
            Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
            Write-Host ""
          }

          Check "whoami (runner's own identity)" { whoami; whoami /groups | Select-String "Administrators|SYSTEM" }
          Check "Node.js full path + version" { Get-Command node | Format-List Source; node -v }
          Check "All Node installs on PATH" { where.exe node }
          Check "NSSM file present" { Test-Path "C:\nssm\nssm.exe"; Get-Item "C:\nssm\nssm.exe" | Format-List Length, LastWriteTime }
          Check "NSSM help (no version flag, some builds lack --version)" { & "C:\nssm\nssm.exe" help } 10
          Check "IIS redirection.config ACL" { icacls "C:\Windows\System32\inetsrv\config\redirection.config" }
