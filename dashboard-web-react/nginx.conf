# Static SPA behind Caddy (infra/Caddyfile terminates TLS and reverse-proxies here) — this
# container only ever serves plain HTTP on the internal Docker network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # react-router client-side routes (e.g. /reports, /admin/accounts) must all resolve to
    # index.html — nginx would otherwise 404 on a hard refresh of a non-root route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite's content-hashed filenames) are safe to cache forever;
    # index.html itself is intentionally left out so a redeploy is picked up immediately.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
