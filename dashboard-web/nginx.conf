# Static Flutter Web build behind Caddy (infra/Caddyfile terminates TLS and reverse-proxies
# here) — this container only ever serves plain HTTP on the internal Docker network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Flutter Web's router (whichever URL strategy the app uses — hash or path-based) needs
    # every non-asset path to resolve to index.html, same rationale as the React SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|wasm|woff2?|ttf|otf|svg|png|jpg|jpeg|ico|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # flutter_service_worker.js/version.json must always be revalidated so a redeploy is
    # detected by the browser's service worker instead of serving a stale cached build forever.
    location ~ ^/(flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }
}
