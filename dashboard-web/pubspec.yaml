name: bao_tin_dashboard
description: "Báo Tin — dashboard trung tâm điều hành (web, admin/senior_officer)."
publish_to: "none"
version: 1.6.1+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.68.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# Same Windows native-assets workaround as mobile-app-citizen/mobile-app-officer — see their
# README for the full explanation (objective_c hook build failure via path_provider_foundation).
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
