name: bao_tin_citizen
description: "Báo Tin — ứng dụng báo tin nhanh cho người dân."
publish_to: "none"
version: 1.9.3+15

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  # Pure Dart (no platform channel) — unlike native_exif, this also compiles for Flutter Web.
  exif: ^3.3.0
  intl: ^0.19.0
  # Bản đồ cảnh báo khu vực (Giai đoạn 3) — OpenStreetMap qua flutter_map, không cần API key
  # trả phí (khác google_maps_flutter), phù hợp cho hệ thống nội bộ không phụ thuộc vendor.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# path_provider_foundation 2.5.0/2.6.0 depend on `objective_c`, whose native-assets build
# hook is currently broken on Windows (fails during `flutter test`/`dart compile kernel`
# regardless of target platform — an ecosystem/tooling issue, not app code). Pinned to the
# last version before that dependency was introduced; remove once upstream fixes it.
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
