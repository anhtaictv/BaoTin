org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows-only: project lives on D:\ but the Pub Cache (plugin sources) lives on C:\. Kotlin's
# incremental compiler tries to compute a relative path between them and throws
# "this and base files have different roots" — disabling incremental compilation is the
# standard workaround (full recompile each run, functionally fine for a dev/demo build).
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
