name: bao_tin_officer
description: "Báo Tin — ứng dụng cho cán bộ phụ trách địa bàn."
publish_to: "none"
version: 1.17.0+25

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  # Same choice as mobile-app-citizen's area_safety_screen: OpenStreetMap via flutter_map,
  # not google_maps_flutter — no paid API key/billing setup needed for a demo/internal tool.
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# path_provider_foundation 2.5.0/2.6.0 depend on `objective_c`, whose native-assets build
# hook is currently broken on Windows (fails during `flutter test`/`dart compile kernel`
# regardless of target platform — an ecosystem/tooling issue, not app code). Pinned to the
# last version before that dependency was introduced; remove once upstream fixes it.
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
